name: Mensa-Daten

on:
  schedule:
    - cron: "7 5 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  abrufen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: mensa.py ausfuehren
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python mensa.py
      - name: Daten speichern
        run: |
          git config user.name "mensa-bot"
          git config user.email "mensa-bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || (git commit -m "Speiseplan aktualisiert" && git push)
